<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us | Spring Power</title>

    <!-- Bootstrap CSS for the navigation bar and responsive layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Logo -->
    <header class="container-fluid">
        <a href="index.html">
            <img src="spring-power-logo.png" alt="Spring Power" class="logo">
        </a>
    </header>

    <!-- Bootstrap navigation bar -->
    <nav class="navbar navbar-expand-sm navbar-light bg-white sticky-top">
        <div class="container justify-content-center">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavigation" aria-controls="mainNavigation"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="mainNavigation">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">

        <!-- heading -->
        <section class="contact-banner">
            <h1>CONTACT US</h1>
        </section>

        <!-- Contact details and location -->
        <div class="row contact-sections">

            <section class="col-md-6 mb-4">
                <div class="contact-box">
                    <h2>Get in touch</h2>

                    <div class="contact-detail">
                        <h3>Email Address</h3>
                        <p><a href="mailto:your-email@example.com">Add your email address</a></p>
                    </div>

                    <div class="contact-detail">
                        <h3>Contact Number</h3>
                        <p><a href="tel:+353000000000">Add your contact number</a></p>
                    </div>

                    <div class="contact-detail">
                        <h3>Hotline Number</h3>
                        <p><a href="tel:+353000000000">Add your hotline number</a></p>
                    </div>
                </div>
            </section>

            <section class="col-md-6 mb-4">
                <div class="contact-box">
                    <h2>Find Us</h2>

                    <div class="location">
                        <strong>Location:</strong>
                        <span>Add your business address here</span>
                    </div>

                    <!-- placeholder business map -->
                    <div class="map-placeholder" role="img" aria-label="Map location placeholder">
                                                <p>Add your location map here</p>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <footer>
        <p>Spring Power</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
